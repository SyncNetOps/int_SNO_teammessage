send_message:
  name: "Nachricht senden (TeamMessage)"
  description: "Sendet eine Nachricht direkt an eine Nummer oder an eine Teamliste/Gruppe."
  fields:
    target_type:
      name: "Versandart"
      description: "Möchtest du eine Direktnachricht oder an eine Gruppe senden?"
      required: true
      default: "direct"
      selector:
        select:
          options:
            - label: "Direkt an Handynummer"
              value: "direct"
            - label: "An Gruppe / Teamliste"
              value: "list"
    message:
      name: "Nachricht"
      description: "Der Text der Nachricht (max. 1600 Zeichen)."
      example: "Wassermelder im Keller hat ausgelöst!"
      required: true
      selector:
        text:
          multiline: true
    to_mobile:
      name: "Zielrufnummer (nur Direktversand)"
      description: "Einzelne Handynummer für direkten Versand (z.B. +491701234567)."
      required: false
      selector:
        text:
    teamlist_email:
      name: "Teamliste / Gruppe (nur Gruppenversand)"
      description: "Die ID oder E-Mail Adresse der Teamliste."
      example: "meinteam@tmsg.de"
      required: false
      selector:
        text:
    channel:
      name: "Bevorzugter Kanal (nur Direktversand)"
      description: "Wähle SMS oder Voice. (Wird bei Gruppen ignoriert)"
      default: "sms"
      selector:
        select:
          options:
            - label: "SMS Textnachricht"
              value: "sms"
            - label: "Sprachanruf (Voice)"
              value: "voice"
    keyword:
      name: "Keyword / Passwort (nur Gruppenversand)"
      description: "Das Keyword für geschlossene Gruppen."
      example: "SMSAlarm"
      required: false
      selector:
        text:
    sender_email:
      name: "Absender E-Mail (nur Gruppenversand)"
      description: "NUR die reine E-Mail Adresse eines Mitglieds (Authentifizierung)."
      example: "user@gmail.com"
      required: false
      selector:
        text:
    from_mobile:
      name: "Absenderkennung (Optional)"
      description: "Überschreibt den Absender (max. 11 Zeichen, alphanumerisch)."
      required: false
      selector:
        text:
    date:
      name: "Datum (Geplant)"
      description: "Format: YYYY-MM-DD"
      required: false
      selector:
        text:
    time:
      name: "Uhrzeit (Geplant)"
      description: "Format: HH:MM"
      required: false
      selector:
        text:
    flash:
      name: "Flash-Nachricht"
      description: "Erscheint direkt auf dem Display (nur SMS)."
      default: false
      selector:
        boolean:
    test:
      name: "Test-Modus"
      description: "Simuliert den Versand, ohne Guthaben zu verbrauchen."
      default: false
      selector:
        boolean:
    ucs2:
      name: "Unicode / Emojis (UCS-2)"
      description: "Erzwingt UCS-2 Codierung für Sonderzeichen."
      default: false
      selector:
        boolean: